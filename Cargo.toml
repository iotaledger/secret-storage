[package]
name = "secret-storage"
version = "0.3.0"
edition = "2021"
authors = ["IOTA Stiftung"]
homepage = "https://www.iota.org"
license = "Apache-2.0"
repository = "https://github.com/iotaledger/secret-storage"
rust-version = "1.65"
readme = "./README.md"
description = "A flexible and secure key storage interface for working with cryptographic keys and signatures with modular traits for key generation, signing, and management."
keywords = ["crypto", "storage", "keys", "signatures", "security"]

[dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
iota-sdk = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "25907f345ed0deb33a56fe40677d1d128209ffea", optional = true }

[features]
default = ["send-sync-storage"]
send-sync-storage = []
# Enables the integration with IOTA SDK.
iota = ["dep:iota-sdk"]
